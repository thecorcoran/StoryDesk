<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFEAA7"/>
      <stop offset="100%" stop-color="#FDCB6E"/>
    </radialGradient>
  </defs>
  <!-- Background Disc -->
  <circle cx="256" cy="256" r="236" fill="url(#grad)" stroke="#D63031" stroke-width="16" />
  
  <!-- Palette / Board -->
  <path d="M120 330 C120 200, 200 130, 310 130 C410 130, 430 220, 390 280 C360 330, 300 310, 270 340 C240 370, 260 410, 210 410 C150 410, 120 380, 120 330 Z" fill="#FFFFFF" stroke="#2D3436" stroke-width="12" stroke-linejoin="round" />
  
  <!-- Color Drops on Palette -->
  <circle cx="200" cy="210" r="22" fill="#D63031" />
  <circle cx="270" cy="185" r="22" fill="#0984E3" />
  <circle cx="340" cy="215" r="22" fill="#00B894" />
  <circle cx="360" cy="280" r="22" fill="#A29BFE" />
  
  <!-- Paintbrush -->
  <g transform="rotate(-38 270 270)">
    <!-- Wooden Handle -->
    <path d="M 285 50 L 295 50 L 298 250 L 282 250 Z" fill="#D35400" stroke="#2D3436" stroke-width="6" />
    <!-- Metal Ferrule -->
    <rect x="280" y="250" width="20" height="40" fill="#CBD5E0" stroke="#2D3436" stroke-width="6" rx="3" />
    <!-- Bristles -->
    <path d="M 280 290 C 275 320, 285 345, 290 355 C 295 345, 305 320, 300 290 Z" fill="#FF7675" stroke="#2D3436" stroke-width="6" />
  </g>
</svg>
